<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OAuth2 Client Test</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f7fafc; }
    .card { background:white; padding:24px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.08); width:360px; }
    h1 { font-size:18px; margin:0 0 12px; }
    label, select, button { display:block; width:100%; margin-top:8px; }
    .providers { display:flex; gap:8px; margin-top:12px; }
    .providers button { flex:1; padding:10px; border-radius:8px; border:1px solid #e2e8f0; background:#fff; cursor:pointer; }
    .note { font-size:12px; color:#666; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>OAuth2 Third-party Login — Test</h1>

    <label for="role">Role (gửi đến server như query param)</label>
    <select id="role">
      <option value="">(none)</option>
      <option value="STUDENT">STUDENT</option>
      <option value="TEACHER">TEACHER</option>
      <option value="ADMIN">ADMIN</option>
    </select>

    <div class="providers">
      <button id="login-google">Login with Google</button>
      <button id="login-github">Login with GitHub</button>
    </div>

    <div style="margin-top:10px;">
      <button id="login-popup" style="width:100%; margin-top:8px;">Open OAuth in popup (Google)</button>
    </div>

    <p class="note">
      Chọn role trước khi bấm nút. Role sẽ gửi đến backend qua query param và được RoleCaptureFilter lưu vào session.
    </p>

    <pre id="output" style="background:#fafafa;border:1px solid #eee;padding:8px;border-radius:6px;font-size:13px;white-space:pre-wrap;"></pre>
  </div>

  <script>
    const BACKEND_URL = "http://localhost:8081"; // backend Spring Boot

    function startUrl(providerId, role) {
      const base = BACKEND_URL + '/oauth2/authorization/' + encodeURIComponent(providerId);
      return role ? base + '?role=ROLE_' + encodeURIComponent(role) : base;
    }

    function appendOutput(text) {
      const out = document.getElementById('output');
      out.textContent += text + '\n';
    }

    // Click Google button
    document.getElementById('login-google').addEventListener('click', function () {
      const role = document.getElementById('role').value;
      console.log(role)
      window.location.href = startUrl('google', role);
      console.log(startUrl('google', role))
    });

    // Click GitHub button
    document.getElementById('login-github').addEventListener('click', function () {
      const role = document.getElementById('role').value;
      window.location.href = startUrl('github', role);
    });

    // Popup flow (Google)
    document.getElementById('login-popup').addEventListener('click', function () {
      const role = document.getElementById('role').value;
      const url = startUrl('google', role);
      const popup = window.open(url, 'oauthWindow', 'width=600,height=700');

      if (!popup) {
        appendOutput('Popup blocked — allow popups for this site or use the normal buttons.');
        return;
      }

      appendOutput('Popup opened. Waiting for user to complete login...');

      const timer = setInterval(function () {
        if (popup.closed) {
          clearInterval(timer);
          appendOutput('Popup closed — reload page or check backend for token.');
        }
      }, 500);
    });

    // Optional: parse token if backend redirects back to frontend
    const params = new URLSearchParams(window.location.search);
    const token = params.get("accessToken");
    if(token){
      localStorage.setItem("jwt", token);
      appendOutput("Received JWT token from backend.");
      // redirect to dashboard
      // window.location.href = "/dashboard.html";
    }
  </script>
</body>
</html>
